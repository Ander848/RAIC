server.port=${PORT:8080}
# Google OAuth2 — pon tu Client ID aquí o como variable de entorno GOOGLE_CLIENT_ID
google.client-id=${GOOGLE_CLIENT_ID:}
# JWT — define JWT_SECRET como variable de entorno en producción
jwt.secret=${JWT_SECRET:checkautos-super-secret-key-2024-must-be-at-least-256bits-long!!}
jwt.expiration.ms=86400000
logging.level.com.checkautos=DEBUG
logging.level.org.springframework.security=WARN

spring.profiles.active=mongo

# Cuentas admin iniciales — formato: "Nombre,email,password;Nombre2,email2,password2"
# Define ADMIN_ACCOUNTS como variable de entorno para no exponer credenciales en el código
admin.accounts=${ADMIN_ACCOUNTS:}
